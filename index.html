<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرفی من</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #ff7e5f;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 4px solid white;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .job {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            opacity: 0.9;
        }
        .social {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .social a {
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .social a:hover {
            background: white;
            color: #1e3c72;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="avatar">👤</div>
    <h1> iam farhad dousti </h1>
    <div class="job">🔹 توسعه‌دهنده وب | علاقه‌مند به تکنولوژی</div>
    <p>
        من عاشق ساخت وب‌سایت و یادگیری چیزهای جدید هستم. 
        اینجا صفحه شخصی منه تا بیشتر با من آشنا بشی.
    </p>
    <div class="social">
        <a href="#">📱 اینستاگرام</a>
        <a href="#">📧 ایمیل</a>
        <a href="#">💼 لینکدین</a>
    </div>
    <div class="footer">ساخته شده با ❤️ توسط من</div>
</div>

</body>
</html>
